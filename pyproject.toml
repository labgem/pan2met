[build-system]
requires = [
	"setuptools",
	"setuptools-scm"
]
build-backend = "setuptools.build_meta"

[project]
name = "pan2met"
description = "Reconstruct (pan)metabolome based on (pan)genome"
dynamic = ["version"]
authors = [
	{ name = "Samuel Ortion" },
]
maintainers = [
	{ name = "Samuel Ortion" },
]
readme = "README.md"
keywords = ["pangenomics", "metabolism", "bioinformatics", "prokaryote"]
classifiers = [
	"Development Status :: 1 - Planning",
	"Environment :: Console",
	"Intended Audience :: Science/Research",
	"Natural Language :: English",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3",
	"Topic :: Scientific/Engineering :: Bio-Informatics"
]
# requires-python = ">=3.9" # ?

dependencies = [
	"numpy",
	"aiosql",
	"sparqlwrapper",
	"python-dotenv",
	"pythoncyc",
	# "clyngor", # "pip install git+https://github.com/Aluriak/clyngor@master",
	"ouisparql",
	"psycopg>=3.3.2",
	"blosc2>=4.1.2",
]

license = { file = "LICENSE" }

[project.optional-dependencies]
doc = [
	"sphinx",
	"sphinx_rtd_theme",
	"readthedocs-sphinx-search",
	"sphinx-autobuild",
]
test = [
	"pytest>=9.0.2",
]

[project.urls]
# Homepage = ""
Repository = "https://gitlab.com/sortion/pan2met"
# Documentation = ""

[project.scripts]
pan2met = "pan2met.cli:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pixi.workspace]
channels = ["conda-forge", "https://conda.anaconda.org/bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
pan2met = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
doc = { features = ["doc"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
graph-tool = ">=2.98,<3"
ppanggolin = { version = ">=2.2.6,<3", channel = "bioconda" }
python = "3.12.*"
pip = ">=26.0.1,<27"
