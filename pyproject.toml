[build-system]
requires = [
	"setuptools",
	"setuptools-scm"
]
build-backend = "setuptools.build_meta"

[project]
name = "pangenome2panmetabolome"
description = "Reconstruct (pan)metabolome based on (pan)genome"
dynamic = ["version"]
authors = [
	{ name = "Samuel Ortion" },
]
maintainers = [
	{ name = "Samuel Ortion" },
]
readme = "README.md"
keywords = ["Pangenomics", "Metabolism", "Bioinformatics", "Prokaryote"]
classifiers = [
	"Development Status :: 1 - Planning",
	"Environment :: Console",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: CEA CNRS Logiciel Libre License, version 2.1 (CeCILL-2.1)",
	"Natural Language :: English",
	"Operating System :: POSIX :: Linux",
	"Programming Language :: Python :: 3",
	"Topic :: Scientific/Engineering :: Bio-Informatics"
]
# requires-python = ">=3.9" # ?

dependencies = [
	"numpy",
	"h5py",
	"hdf5plugin",
	"ppanggolin",
	"pybiopax",
	"aiosql",
	"sparqlwrapper",
	"python-dotenv",
	"pythoncyc",
    "clyngor",
	#"ouisparql", (currently installed from git)
]

license = { file = "LICENSE" }

[project.optional-dependencies]
doc = [
	"sphinx",
	"sphinx_rtd_theme",
	"readthedocs-sphinx-search",
	"sphinx-autobuild"
]
test = [
	"pytest"
]

[project.urls]
# Homepage = ""
Repository = "https://gitlab.com/sortion/pangenome2panmetabolome"
# Documentation = ""

[project.scripts]
pangenome2panmetabolome = "pangenome2panmetabolome.main:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }
